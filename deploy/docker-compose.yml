services:
  db-probe:
    image: postgres:16-alpine
    container_name: hrms-db-probe
    restart: unless-stopped
    environment:
      PGPASSWORD: "${DB_PASSWORD}"
    command: ["sh", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h ${DB_HOST} -p ${DB_PORT} -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  hrms-app:
    image: vishnuksurendran/hrms:latest
    container_name: hrms-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db-probe:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
      Cors__AllowedOrigins__0: "${APP_URL}"
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
